<text x="52.0" y="236.0" font-size="18" fill="#5c5f6e">best published methods, same cases: 80–81%</text>
<text x="52.0" y="262.0" font-size="18" fill="#5c5f6e">vs n-sigma, case by case: 40 to 9, p = 9.3e-6</text>
<text x="520.0" y="78.0" font-size="17" font-weight="600" fill="#0b0c10">Sherlog, auto route</text>
