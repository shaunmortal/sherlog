<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" font-family="system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sherlog in numbers</title>
<desc id="d">Sherlog in numbers. On 252 real outages of a public benchmark, Sherlog ranked the root cause first in 92%, against 80% to 81% for the best published methods re-run on the same cases; case by case against n-sigma, 40 to 9, p = 9.3e-6. Ranked first: Sherlog auto route 92%, Sherlog call-graph rule with no AI 83%, multi-source n-sigma 81%, n-sigma 80%, BARO 29%. On the same inputs without the AI, 83%. Median cost $0.0024 per real outage, $8.01 for all 252. Controlled benchmark, hard mode with a decoy: the Opus agent gave 0 wrong answers and named the cause first in 43 of 44.</desc>
<rect width="1280" height="510" rx="28" fill="#f0f1fa"/>
<rect x="20.5" y="20.5" width="1239.0" height="261.0" rx="18" fill="#ffffff" stroke="#d9dbe7"/>
